name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # 自定义仓库无法满足品牌资源校验；忽略装饰性检查项
          ignore: brands images

  # 说明：未启用 hassfest。
  # 原因：本集成固定 pytraccar==2.1.1（username/password 认证），
  # 而 HA 当前已内置 pytraccar==3.0.0（改为 token 认证），
  # hassfest 会判定 REQUIREMENTS 冲突而失败。
  # 迁移到 3.0.0 需要改造配置流程与认证方式，属于破坏性变更，待后续版本处理。
